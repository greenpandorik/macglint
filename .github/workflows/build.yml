name: Build and test
on:
  push:
    branches: [main, feat/native-app]
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Build local app and DMG
        run: ./scripts/make-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MacGlint-local-preview
          path: build/*.dmg
          retention-days: 14
